<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 블로썸 길드 공식 아지트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #151021;
      color: #ffffff;
      font-family: 'Segoe UI', Malgun Gothic, sans-serif;
      min-height: 100vh;
      /* 디마/벚꽃 테마 감성 배경 패턴 */
      background-image: 
        radial-gradient(#ff758c 0.8px, transparent 0.8px), 
        radial-gradient(#00ffcc 0.6px, #151021 0.6px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 🎮 상단 게임 카테고리 네비게이션 바 (디지바이스 네온 스타일) */
    nav.navbar {
      width: 100%;
      background: linear-gradient(90deg, #1e122b, #2b173d, #1e122b);
      border-bottom: 4px solid #ff758c;
      box-shadow: 0 4px 20px rgba(255, 117, 140, 0.4);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
    }
    .nav-container {
      width: 100%;
      max-width: 950px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      height: 65px;
    }
    .brand-logo {
      font-size: 1.4rem;
      font-weight: 900;
      color: #ff9a9e;
      text-decoration: none;
      text-shadow: 0 0 10px #ff758c, 2px 2px 0 #000;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-menu {
      display: flex;
      list-style: none;
      gap: 10px;
    }
    .nav-link {
      color: #e2d9f3;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 117, 140, 0.1);
    }
    .nav-link:hover {
      background: #ff758c;
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 12px #ff758c;
      transform: translateY(-2px);
    }
    .nav-link.support {
      background: rgba(114, 137, 218, 0.2);
      border-color: #7289da;
      color: #7289da;
    }
    .nav-link.support:hover {
      background: #7289da;
      color: #fff;
      box-shadow: 0 0 12px #7289da;
    }

    .main-container {
      width: 100%;
      max-width: 950px;
      padding: 30px 20px;
    }

    /* 메인 히어로 헤더 (블로썸 길드 타이틀) */
    header.hero-header {
      text-align: center;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #2b1f3d, #3c254e);
      padding: 30px 20px;
      border-radius: 20px;
      border: 4px solid #ff758c;
      box-shadow: 0 8px 0 #b33951, 0 15px 25px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }
    header.hero-header::before {
      content: "🌸 DIGITAL MONSTER GUILD 🌸";
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #00ffcc;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00ffcc;
    }
    header.hero-header h1 {
      font-size: 2.3rem;
      color: #ff9a9e;
      margin: 10px 0 6px 0;
      text-shadow: 3px 3px 0px #000, 0 0 15px rgba(255,117,140,0.6);
    }
    header.hero-header p {
      font-size: 0.95rem;
      color: #d1c4e9;
      font-weight: 600;
    }

    /* 🚀 게임 유틸리티 퀵 바로가기 카드 (디마 아티팩트 스타일) */
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 35px;
    }
    @media (max-width: 650px) {
      .quick-grid {
        grid-template-columns: 1fr;
      }
      .nav-menu {
        gap: 4px;
      }
      .nav-link {
        font-size: 0.75rem;
        padding: 6px 8px;
      }
    }
    .quick-card {
      background: linear-gradient(145deg, #2b1f3d, #231834);
      border: 3px solid #ff758c;
      border-radius: 16px;
      padding: 22px;
      text-decoration: none;
      color: #fff;
      box-shadow: 0 6px 0 #b33951, inset 0 0 15px rgba(255,117,140,0.15);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .quick-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 0 #b33951, 0 0 20px rgba(255,117,140,0.4);
      border-color: #ff9a9e;
    }
    .quick-card:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #b33951;
    }
    .quick-icon {
      font-size: 3rem;
      background: #1a1528;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 2px solid #ff758c;
      box-shadow: inset 0 0 8px rgba(255,117,140,0.5);
    }
    .quick-info h3 {
      font-size: 1.25rem;
      color: #ff9a9e;
      margin-bottom: 5px;
      text-shadow: 1px 1px 0 #000;
    }
    .quick-info p {
      font-size: 0.82rem;
      color: #bfaedc;
      line-height: 1.35;
    }

    /* 📢 공지사항 & 이벤트 소식 게시판 섹션 (게임 UI 패널) */
    .board-section {
      background: #231834;
      border-radius: 18px;
      padding: 25px;
      border: 4px solid #ff758c;
      box-shadow: 0 8px 0 #b33951;
    }
    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #ff758c;
    }
    .board-title {
      font-size: 1.35rem;
      font-weight: bold;
      color: #ff9a9e;
      text-shadow: 2px 2px 0 #000;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    button {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 7px 14px;
      border-radius: 8px;
      border: 2px solid #222;
      outline: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s;
    }
    .btn-admin {
      background: #ffb703;
      color: #111;
      border-color: #d48b00;
      box-shadow: 0 3px 0 #b57600;
    }
    .btn-admin:hover {
      background: #ffd043;
    }
    .btn-admin:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 관리자 작성 폼 */
    .notice-form {
      display: none;
      background: #3d2b27;
      padding: 18px;
      border-radius: 14px;
      border: 3px solid #ffb703;
      margin-bottom: 20px;
      box-shadow: 0 4px 0 #b57600;
    }
    .notice-form.active {
      display: block;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-group input, .form-group textarea {
      background: #151021;
      color: #fff;
      border: 2px solid #554270;
      padding: 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: #ffb703;
    }
    .btn-submit {
      background: #ffb703;
      color: #000;
      border-color: #d48b00;
      box-shadow: 0 3px 0 #b57600;
      align-self: flex-end;
    }

    /* 공지 목록 카드 (디마 공지사항 감성) */
    .notice-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .notice-card {
      background: #2b1f3d;
      border-radius: 12px;
      padding: 16px 18px;
      border: 2px solid #ff758c;
      box-shadow: 0 4px 0 #b33951;
      position: relative;
      transition: 0.15s;
    }
    .notice-card:hover {
      border-color: #00ffcc;
      box-shadow: 0 4px 0 #00aa88;
    }
    .notice-badge {
      display: inline-block;
      background: #ff758c;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      box-shadow: 0 2px 0 #b33951;
    }
    .notice-card h4 {
      font-size: 1.12rem;
      color: #fff;
      margin-bottom: 8px;
      text-shadow: 1px 1px 0 #000;
    }
    .notice-card p {
      font-size: 0.9rem;
      color: #d1c4e9;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .notice-date {
      font-size: 0.72rem;
      color: #9a8bb0;
      margin-top: 10px;
    }
    .btn-del-notice {
      position: absolute;
      top: 14px;
      right: 14px;
      background: transparent;
      color: #ff758c;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-del-notice:hover {
      color: #ff5252;
    }
  </style>
</head>
