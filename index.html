<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 블로썸 길드 아지트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #120f1d;
      color: #ffffff;
      font-family: 'Segoe UI', Malgun Gothic, sans-serif;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(#ff9a9e 0.6px, transparent 0.6px), radial-gradient(#ff9a9e 0.6px, #120f1d 0.6px);
      background-size: 24px 24px;
    }
    .container { width: 100%; max-width: 900px; }

    /* 치지직 방송 홍보 배너 */
    .stream-banner {
      background: linear-gradient(90deg, #1e1b2e 0%, #2b1f3d 100%);
      border: 2px solid #554270;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: 0.3s;
    }
    /* LIVE 방송 중일 때 스타일 */
    .stream-banner.is-live {
      border-color: #ff5252;
      box-shadow: 0 0 20px rgba(255, 82, 82, 0.4);
      background: linear-gradient(90deg, #2e1b25 0%, #3d1f2b 100%);
    }

    .stream-info { display: flex; align-items: center; gap: 12px; }
    
    .stream-badge {
      background: #4a3b63;
      color: #d1c4e9;
      font-weight: bold;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: 0.3s;
    }
    .stream-banner.is-live .stream-badge {
      background: #ff5252;
      color: #fff;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .stream-text h4 { font-size: 0.95rem; color: #fff; margin-bottom: 2px; }
    .stream-text p { font-size: 0.78rem; color: #bfaedc; }
    
    .btn-chzzk {
      background: #00ffa3;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      transition: 0.2s;
      box-shadow: 0 3px 0 #00b372;
    }
    .btn-chzzk:hover { background: #33ffb8; transform: translateY(-1px); }

    header {
      text-align: center;
      margin-bottom: 25px;
      background: #2b1f3d;
      padding: 22px;
      border-radius: 16px;
      border: 4px solid #ff758c;
      box-shadow: 0 6px 0 #b33951;
    }
    header h1 { font-size: 2rem; color: #ff9a9e; margin-bottom: 6px; text-shadow: 2px 2px 0px #000; }
    header p { font-size: 0.9rem; color: #d1c4e9; }

    /* 메인 메뉴 카드 그리드 */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .menu-card {
      background: #2b1f3d;
      border-radius: 14px;
      padding: 20px;
      border: 3px solid #ff758c;
      box-shadow: 0 5px 0 #b33951;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.2s;
    }
    .menu-card:hover { transform: translateY(-3px); border-color: #00ffcc; box-shadow: 0 8px 0 #00aa88; }
    .card-title { font-size: 1.25rem; font-weight: bold; color: #ff9a9e; margin-bottom: 8px; }
    .card-desc { font-size: 0.85rem; color: #d1c4e9; line-height: 1.4; margin-bottom: 15px; }
    .card-go { font-size: 0.8rem; font-weight: bold; color: #00ffcc; text-align: right; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 🎮 우비테이머 실시간 라이브 연동 배너 -->
    <div class="stream-banner" id="streamBanner">
      <div class="stream-info">
        <span class="stream-badge" id="liveBadge">OFFLINE</span>
        <div class="stream-text">
          <h4 id="streamTitle">🎮 우비테이머 방송국</h4>
          <p id="streamDesc">디지몬 마스터즈 라이브 스트리밍</p>
        </div>
      </div>
      <a href="https://chzzk.naver.com/241f32b55087d010e6a1b2468b45d8b8" id="chzzkLink" target="_blank" class="btn-chzzk">📺 방송 보러가기</a>
    </div>

    <header>
      <h1>🌸 블로썸 길드 통합 아지트</h1>
      <p>디지몬 마스터즈 블로썸 길드원 전용 숙제 & 일정 관리 센터</p>
    </header>

    <div class="menu-grid">
      <a href="todo.html" class="menu-card">
        <div>
          <div class="card-title">✅ 숙제 체크리스트</div>
          <div class="card-desc">일일/주간 던전 숙제 체크 및 개인 맞춤 횟수 세팅 시스템</div>
        </div>
        <div class="card-go">바로가기 ▶</div>
      </a>

      <a href="event.html" class="menu-card">
        <div>
          <div class="card-title">📅 이벤트 & 일정 타임라인</div>
          <div class="card-desc">검은사막 스타일 실시간 가로형 일정표 및 길드 행사 캘린더</div>
        </div>
        <div class="card-go">바로가기 ▶</div>
      </a>

      <a href="timer.html" class="menu-card">
        <div>
          <div class="card-title">⏱️ 버프 타이머</div>
          <div class="card-desc">경험치 & 물약 버프 시간 카운트다운 알림 소리 기능</div>
        </div>
        <div class="card-go">바로가기 ▶</div>
      </a>
    </div>

  </div>

  <script>
    // 🌟 치지직 URL 기반 라이브 상태 감지
    const chzzkUrl = document.getElementById('chzzkLink').href;
    
    // URL에서 채널 고유 ID 추출
    function extractChannelId(url) {
      const match = url.match(/chzzk\.naver\.com\/(?:live\/)?([a-zA-Z0-9]+)/);
      return match ? match[1] : null;
    }

    async function checkChzzkLiveStatus() {
      const channelId = extractChannelId(chzzkUrl);
      if (!channelId) return;

      const banner = document.getElementById('streamBanner');
      const badge = document.getElementById('liveBadge');
      const desc = document.getElementById('streamDesc');

      try {
        // 프록시 API를 사용하여 실시간 방송 상태 데이터 로드
        const res = await fetch(`https://api.chzzk.naver.com/service/v1/channels/${channelId}/live-detail`);
        const data = await res.json();

        if (data && data.content && data.content.status === 'OPEN') {
          // 방송 중 (OPEN)일 때
          banner.classList.add('is-live');
          badge.innerText = '🔴 LIVE 방송 중';
          
          const liveTitle = data.content.liveTitle || '디지몬 마스터즈 방송 진행 중!';
          desc.innerText = liveTitle;
        } else {
          // 방송이 아닐 때 (CLOSE)
          banner.classList.remove('is-live');
          badge.innerText = 'OFFLINE';
          desc.innerText = '디지몬 마스터즈 라이브 스트리밍';
        }
      } catch (err) {
        // CORS 또는 로딩 오류 시 기본 오프라인 상태 유지
        console.log("치지직 상태 감지 대기 중");
      }
    }

    // 로딩 시 1회 체크 및 1분마다 상태 자동 갱신
    checkChzzkLiveStatus();
    setInterval(checkChzzkLiveStatus, 60000);
  </script>
</body>
</html>
