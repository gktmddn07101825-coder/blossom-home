<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 블로썸 디마 숙제 체크리스트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1528;
      color: #ffffff;
      font-family: 'Segoe UI', Malgun Gothic, sans-serif;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(#ff9a9e 0.6px, transparent 0.6px), radial-gradient(#ff9a9e 0.6px, #1a1528 0.6px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    .container {
      width: 100%;
      max-width: 850px;
    }
    
    header {
      text-align: center;
      margin-bottom: 20px;
      background: #2b1f3d;
      padding: 18px;
      border-radius: 16px;
      border: 4px solid #ff758c;
      box-shadow: 0 6px 0 #b33951, 0 10px 20px rgba(0,0,0,0.4);
    }
    header h1 {
      font-size: 1.8rem;
      color: #ff9a9e;
      margin-bottom: 4px;
      text-shadow: 2px 2px 0px #000;
    }
    header p {
      font-size: 0.85rem;
      color: #d1c4e9;
      font-weight: 500;
    }

    .controls-panel {
      background: #2b1f3d;
      padding: 12px 15px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border: 3px solid #ff758c;
      box-shadow: 0 4px 0 #b33951;
    }
    button, input, select {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #222;
      outline: none;
    }
    .btn {
      background: #ff758c;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #b33951;
      transition: 0.1s;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .btn-admin {
      background: #ffb703;
      color: #111;
      border-color: #d48b00;
      box-shadow: 0 3px 0 #b57600;
    }
    .btn-user-add {
      background: #00ffcc;
      color: #111;
      border-color: #00aa88;
      box-shadow: 0 3px 0 #008866;
    }
    .btn-restore {
      background: #a18cd1;
      border-color: #7b52ae;
      box-shadow: 0 3px 0 #5c3d8a;
    }

    .reset-info {
      font-size: 0.8rem;
      color: #ffb7c5;
      text-align: center;
      margin-bottom: 20px;
      background: rgba(43, 31, 61, 0.8);
      padding: 8px;
      border-radius: 8px;
      border: 1px dashed #ff758c;
    }

    .homework-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 650px) {
      .homework-grid {
        grid-template-columns: 1fr;
      }
    }

    .homework-column {
      background: #2b1f3d;
      border-radius: 14px;
      padding: 16px;
      border: 3px solid #ff758c;
      box-shadow: 0 5px 0 #b33951;
      display: flex;
      flex-direction: column;
    }
    .column-header {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff9a9e;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px dashed #ff758c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 1px 1px 0 #000;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .todo-item {
      background: #382950;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #ff758c;
      box-shadow: 0 3px 0 #b33951;
      transition: 0.2s;
    }
    .todo-item.custom {
      border-color: #00ffcc;
      box-shadow: 0 3px 0 #00aa88;
      background: #203335;
    }
    .todo-item.done {
      opacity: 0.45;
      background: #1c1427;
      border-color: #554270;
      box-shadow: none;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #9a8bb0;
    }
    .todo-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .todo-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #ff758c;
    }
    .todo-text {
      font-size: 0.92rem;
      font-weight: bold;
      color: #fff;
    }
    .custom-badge {
      font-size: 0.65rem;
      background: #00ffcc;
      color: #000;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: bold;
      margin-right: 4px;
    }

    .count-select {
      background: #1a1528;
      color: #00ffcc;
      border: 1px solid #554270;
      font-size: 0.78rem;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 6px;
    }

    .todo-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-del {
      background: transparent;
      color: #ff758c;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      font-weight: bold;
      padding: 0 4px;
    }
    .btn-del:hover {
      color: #ff5252;
    }

    .panel-box {
      display: none;
      background: #3d2b27;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .panel-box.active {
      display: block;
    }
    .admin-panel {
      border: 3px solid #ffb703;
      box-shadow: 0 4px 0 #b57600;
    }
    .user-panel {
      border: 3px solid #00ffcc;
      background: #1e3335;
      box-shadow: 0 4px 0 #008866;
    }
    .panel-box h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-group {
      display: flex;
      gap: 8px;
    }
    .form-group input, .form-group select {
      background: #1a1528;
      color: #fff;
      flex: 1;
      border-color: #554270;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🌸 블로썸 디마 숙제 체크리스트</h1>
      <p>공용 기본 숙제 + 맞춤 횟수(최대 20회) 설정 시스템</p>
    </header>

    <div class="controls-panel">
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-restore" onclick="restoreDefault()">🔄 내 체크/횟수 초기화</button>
        <button class="btn btn-user-add" onclick="toggleUserPanel()">➕ 내 개인 숙제 추가</button>
      </div>
      <button class="btn btn-admin" id="adminToggleBtn" onclick="tryAdminLogin()">🔒 관리자 (공용 목록 수정)</button>
    </div>

    <!-- 관리자 공용 목록 추가 패널 -->
    <div class="panel-box admin-panel" id="adminPanel">
      <h3 style="color: #ffb703;">
        <span>🛠️ [관리자 모드] 공용 숙제 추가/삭제</span>
        <button class="btn" style="font-size: 0.75rem; padding: 3px 8px; background:#ff5252;" onclick="logoutAdmin()">닫기</button>
      </h3>
      <div class="form-group">
        <select id="adminNewType" style="max-width: 110px;">
          <option value="daily">☀️ 일일</option>
          <option value="weekly">📅 주간</option>
        </select>
        <input type="text" id="adminNewTitle" placeholder="모든 길드원에게 보일 공용 숙제 이름">
        <button class="btn" style="background:#ffb703; color:#000; font-weight:bold;" onclick="addMasterTodo()">공용 추가</button>
      </div>
    </div>

    <!-- 유저 개인 숙제 추가 패널 -->
    <div class="panel-box user-panel" id="userPanel">
      <h3 style="color: #00ffcc;">
        <span>👤 [개인 숙제 추가] 내 화면에만 나만의 숙제 만들기</span>
        <button class="btn" style="font-size: 0.75rem; padding: 3px 8px; background:#ff5252;" onclick="toggleUserPanel()">닫기</button>
      </h3>
      <div class="form-group">
        <select id="userNewType" style="max-width: 110px;">
          <option value="daily">☀️ 일일</option>
          <option value="weekly">📅 주간</option>
        </select>
        <input type="text" id="userNewTitle" placeholder="내가 따로 돌고 싶은 개인 던전/숙제 이름">
        <button class="btn" style="background:#00ffcc; color:#000; font-weight:bold;" onclick="addUserCustomTodo()">내 숙제 추가</button>
      </div>
    </div>

    <div class="reset-info">
      ⏱️ **일일 숙제**: 매일 00시 자동 리셋 | 📅 **주간 숙제**: 매주 화요일 08시 자동 리셋<br>
      💡 사이트가 업데이트되어도 내가 세팅한 횟수(최대 20회)와 [내 숙제]는 유지됩니다!
    </div>

    <div class="homework-grid">
      <div class="homework-column">
        <div class="column-header">
          <span>☀️ 일일 숙제</span>
          <button class="btn" style="font-size: 0.75rem; padding: 4px 8px;" onclick="resetCheck('daily')">수동 체크 해제</button>
        </div>
        <div class="todo-list" id="dailyList"></div>
      </div>

      <div class="homework-column">
        <div class="column-header">
          <span>📅 주간 숙제</span>
          <button class="btn" style="font-size: 0.75rem; padding: 4px 8px;" onclick="resetCheck('weekly')">수동 체크 해제</button>
        </div>
        <div class="todo-list" id="weeklyList"></div>
      </div>
    </div>
  </div>

  <script>
    // 🌟 기본 공용 퀘스트 목록 (주간 숙제 2개 추가 완료)
    const DEFAULT_MASTER_TODOS = [
      // 일일 숙제 (4개)
      { id: 101, type: "daily", title: "17주년 퀘스트", defaultCount: "1회" },
      { id: 102, type: "daily", title: "간쿠몬 퀘스트", defaultCount: "1회" },
      { id: 103, type: "daily", title: "홀리엔젤몬 퀘스트", defaultCount: "1회" },
      { id: 104, type: "daily", title: "에테몬 퀘스트", defaultCount: "1회" },

      // 주간 숙제 (11개: 키노, 네버랜드 추가 완료)
      { id: 201, type: "weekly", title: "사성수 던전 퀘스트", defaultCount: "2회" },
      { id: 202, type: "weekly", title: "다크웹", defaultCount: "1회" },
      { id: 203, type: "weekly", title: "스사노오몬 던전", defaultCount: "1회" },
      { id: 204, type: "weekly", title: "카이저의 기지 Easy (키이)", defaultCount: "1회" },
      { id: 205, type: "weekly", title: "카이저의 기지 노말 ( 키노 ) 160제한", defaultCount: "1회" },
      { id: 206, type: "weekly", title: "네버랜드", defaultCount: "1회" },
      { id: 207, type: "weekly", title: "로얄 베이스 어려움 (로어)", defaultCount: "1회" },
      { id: 208, type: "weekly", title: "카이저의 영역 레이드 (카영레)", defaultCount: "12회" },
      { id: 209, type: "weekly", title: "그림자 미궁 퀘스트", defaultCount: "2회" },
      { id: 210, type: "weekly", title: "디지몬 카이저 노말 (메청던)", defaultCount: "1회" },
      { id: 211, type: "weekly", title: "상점가 이지,노말 하드 / 악목던전 (입장횟수 공유)", defaultCount: "3회" }
    ];

    let MASTER_TODOS = DEFAULT_MASTER_TODOS;

    let USER_CUSTOM_TODOS = JSON.parse(localStorage.getItem('blossom_user_custom_todos_v8')) || [];
    let userStates = JSON.parse(localStorage.getItem('blossom_user_states_v11')) || {};
    let userCounts = JSON.parse(localStorage.getItem('blossom_user_counts_v6')) || {};
    let resetTimes = JSON.parse(localStorage.getItem('blossom_reset_times_v11')) || { lastDaily: 0, lastWeekly: 0 };
    
    let isAdmin = sessionStorage.getItem('blossom_is_admin') === 'true';
    const ADMIN_PASSWORD = "gktmddn0710";

    // 1. 일일 리셋 시간 (매일 자정 00:00)
    function getLastDailyResetTime() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }

    // 2. 주간 리셋 시간 (매주 화요일 오전 08:00)
    function getLastWeeklyResetTime() {
      const d = new Date();
      const day = d.getDay();
      let diff = day - 2;
      
      if (diff === 0 && d.getHours() < 8) {
        diff = 7;
      } else if (diff < 0) {
        diff += 7;
      }
      
      d.setDate(d.getDate() - diff);
      d.setHours(8, 0, 0, 0);
      return d.getTime();
    }

    function checkAutoReset() {
      const now = Date.now();
      const targetDailyReset = getLastDailyResetTime();
      const targetWeeklyReset = getLastWeeklyResetTime();
      let isChanged = false;

      if (resetTimes.lastDaily < targetDailyReset) {
        MASTER_TODOS.filter(t => t.type === 'daily').forEach(t => { userStates[t.id] = false; });
        USER_CUSTOM_TODOS.filter(t => t.type === 'daily').forEach(t => { userStates[t.id] = false; });
        resetTimes.lastDaily = now;
        isChanged = true;
      }

      if (resetTimes.lastWeekly < targetWeeklyReset) {
        MASTER_TODOS.filter(t => t.type === 'weekly').forEach(t => { userStates[t.id] = false; });
        USER_CUSTOM_TODOS.filter(t => t.type === 'weekly').forEach(t => { userStates[t.id] = false; });
        resetTimes.lastWeekly = now;
        isChanged = true;
      }

      if (isChanged) save();
    }

    function save() {
      localStorage.setItem('blossom_master_todos_v8', JSON.stringify(MASTER_TODOS));
      localStorage.setItem('blossom_user_custom_todos_v8', JSON.stringify(USER_CUSTOM_TODOS));
      localStorage.setItem('blossom_user_states_v11', JSON.stringify(userStates));
      localStorage.setItem('blossom_user_counts_v6', JSON.stringify(userCounts));
      localStorage.setItem('blossom_reset_times_v11', JSON.stringify(resetTimes));
    }

    function render() {
      checkAutoReset();

      const dailyContainer = document.getElementById('dailyList');
      const weeklyContainer = document.getElementById('weeklyList');
      const adminPanel = document.getElementById('adminPanel');
      const adminToggleBtn = document.getElementById('adminToggleBtn');

      dailyContainer.innerHTML = '';
      weeklyContainer.innerHTML = '';

      if (isAdmin) {
        adminPanel.classList.add('active');
        adminToggleBtn.style.display = 'none';
      } else {
        adminPanel.classList.remove('active');
        adminToggleBtn.style.display = 'block';
      }

      renderTodoList(MASTER_TODOS, dailyContainer, weeklyContainer, false);
      renderTodoList(USER_CUSTOM_TODOS, dailyContainer, weeklyContainer, true);
    }

    function renderTodoList(list, dailyContainer, weeklyContainer, isCustom) {
      list.forEach(item => {
        const isDone = !!userStates[item.id];
        const currentCount = userCounts[item.id] || item.defaultCount || "1회";

        const div = document.createElement('div');
        div.className = `todo-item ${isDone ? 'done' : ''} ${isCustom ? 'custom' : ''}`;
        
        let optionsHtml = '';
        for (let i = 1; i <= 20; i++) {
          const val = i + "회";
          optionsHtml += `<option value="${val}" ${currentCount === val ? 'selected' : ''}>${i}회</option>`;
        }
        optionsHtml += `<option value="자유" ${currentCount === '자유' ? 'selected' : ''}>자유</option>`;

        div.innerHTML = `
          <div class="todo-left">
            <input type="checkbox" class="todo-checkbox" ${isDone ? 'checked' : ''} onchange="toggleTodo(${item.id})">
            <span class="todo-text">
              ${isCustom ? '<span class="custom-badge">내숙제</span>' : ''}
              ${item.title}
            </span>
          </div>
          <div class="todo-right">
            <select class="count-select" onchange="updateCount(${item.id}, this)">
              ${optionsHtml}
            </select>
            ${isAdmin && !isCustom ? `<button class="btn-del" onclick="deleteMasterTodo(${item.id})" title="공용 삭제">✕</button>` : ''}
            ${isCustom ? `<button class="btn-del" onclick="deleteUserCustomTodo(${item.id})" title="내 숙제 삭제">✕</button>` : ''}
          </div>
        `;

        if (item.type === 'daily') {
          dailyContainer.appendChild(div);
        } else {
          weeklyContainer.appendChild(div);
        }
      });
    }

    function toggleTodo(id) {
      userStates[id] = !userStates[id];
      save();
      render();
    }

    function updateCount(id, selectEl) {
      userCounts[id] = selectEl.value;
      save();
    }

    function tryAdminLogin() {
      const inputPw = prompt("관리자 비밀번호를 입력하세요:");
      if (inputPw === ADMIN_PASSWORD) {
        isAdmin = true;
        sessionStorage.setItem('blossom_is_admin', 'true');
        alert("관리자 모드가 활성화되었습니다!");
        render();
      } else if (inputPw !== null) {
        alert("비밀번호가 틀렸습니다!");
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      sessionStorage.removeItem('blossom_is_admin');
      render();
    }

    function toggleUserPanel() {
      const panel = document.getElementById('userPanel');
      panel.classList.toggle('active');
    }

    function addMasterTodo() {
      const type = document.getElementById('adminNewType').value;
      const title = document.getElementById('adminNewTitle').value.trim();

      if (!title) {
        alert("공용 숙제 이름을 입력해주세요!");
        return;
      }

      const newId = Date.now();
      MASTER_TODOS.push({ id: newId, type: type, title: title, defaultCount: "1회" });
      userStates[newId] = false;
      userCounts[newId] = "1회";

      save();
      render();
      document.getElementById('adminNewTitle').value = '';
    }

    function addUserCustomTodo() {
      const type = document.getElementById('userNewType').value;
      const title = document.getElementById('userNewTitle').value.trim();

      if (!title) {
        alert("추가할 개인 숙제 이름을 입력해주세요!");
        return;
      }

      const newId = Date.now() + Math.random();
      USER_CUSTOM_TODOS.push({ id: newId, type: type, title: title, defaultCount: "1회" });
      userStates[newId] = false;
      userCounts[newId] = "1회";

      save();
      render();
      document.getElementById('userNewTitle').value = '';
      document.getElementById('userPanel').classList.remove('active');
    }

    function deleteMasterTodo(id) {
      if (confirm("이 공용 숙제를 모든 유저 목록에서 삭제하시겠습니까?")) {
        MASTER_TODOS = MASTER_TODOS.filter(t => t.id !== id);
        delete userStates[id];
        delete userCounts[id];
        save();
        render();
      }
    }

    function deleteUserCustomTodo(id) {
      if (confirm("이 개인 숙제를 목록에서 삭제하시겠습니까?")) {
        USER_CUSTOM_TODOS = USER_CUSTOM_TODOS.filter(t => t.id !== id);
        delete userStates[id];
        delete userCounts[id];
        save();
        render();
      }
    }

    function resetCheck(type) {
      const typeName = type === 'daily' ? '일일' : '주간';
      if (confirm(`${typeName} 숙제 체크를 모두 해제하시겠습니까? (설정하신 회수는 유지됩니다!)`)) {
        MASTER_TODOS.filter(t => t.type === type).forEach(t => { userStates[t.id] = false; });
        USER_CUSTOM_TODOS.filter(t => t.type === type).forEach(t => { userStates[t.id] = false; });
        save();
        render();
      }
    }

    function restoreDefault() {
      if (confirm("내 체크 상태와 회수 설정을 초기화하시겠습니까? (직접 추가한 개인 숙제는 유지됩니다)")) {
        userStates = {};
        userCounts = {};
        save();
        render();
      }
    }

    setInterval(checkAutoReset, 60000);
    render();
  </script>
</body>
</html>
