<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 블로썸 디마 숙제 체크리스트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1528;
      color: #ffffff;
      font-family: 'Segoe UI', Malgun Gothic, sans-serif;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(#ff9a9e 0.6px, transparent 0.6px), radial-gradient(#ff9a9e 0.6px, #1a1528 0.6px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    .container {
      width: 100%;
      max-width: 850px;
    }
    
    header {
      text-align: center;
      margin-bottom: 20px;
      background: #2b1f3d;
      padding: 18px;
      border-radius: 16px;
      border: 4px solid #ff758c;
      box-shadow: 0 6px 0 #b33951, 0 10px 20px rgba(0,0,0,0.4);
    }
    header h1 {
      font-size: 1.8rem;
      color: #ff9a9e;
      margin-bottom: 4px;
      text-shadow: 2px 2px 0px #000;
    }
    header p {
      font-size: 0.85rem;
      color: #d1c4e9;
      font-weight: 500;
    }

    .controls-panel {
      background: #2b1f3d;
      padding: 12px 15px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border: 3px solid #ff758c;
      box-shadow: 0 4px 0 #b33951;
    }
    button, input, select {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #222;
      outline: none;
    }
    .btn {
      background: #ff758c;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #b33951;
      transition: 0.1s;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .btn-admin {
      background: #ffb703;
      color: #111;
      border-color: #d48b00;
      box-shadow: 0 3px 0 #b57600;
    }
    .btn-user-add {
      background: #00ffcc;
      color: #111;
      border-color: #00aa88;
      box-shadow: 0 3px 0 #008866;
    }
    .btn-restore {
      background: #a18cd1;
      border-color: #7b52ae;
      box-shadow: 0 3px 0 #5c3d8a;
    }

    .reset-info {
      font-size: 0.8rem;
      color: #ffb7c5;
      text-align: center;
      margin-bottom: 20px;
      background: rgba(43, 31, 61, 0.8);
      padding: 8px;
      border-radius: 8px;
      border: 1px dashed #ff758c;
    }

    .homework-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 650px) {
      .homework-grid {
        grid-template-columns: 1fr;
      }
    }

    .homework-column {
      background: #2b1f3d;
      border-radius: 14px;
      padding: 16px;
      border: 3px solid #ff758c;
      box-shadow: 0 5px 0 #b33951;
      display: flex;
      flex-direction: column;
    }
    .column-header {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff9a9e;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px dashed #ff758c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 1px 1px 0 #000;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .todo-item {
      background: #382950;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #ff758c;
      box-shadow: 0 3px 0 #b33951;
      transition: 0.2s;
    }
    /* 유저가 직접 추가한 개인 숙제 스타일 구분 (초록빛 테두리) */
    .todo-item.custom {
      border-color: #00ffcc;
      box-shadow: 0 3px 0 #00aa88;
      background: #203335;
    }
    .todo-item.done {
      opacity: 0.45;
      background: #1c1427;
      border-color: #554270;
      box-shadow: none;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #9a8bb0;
    }
    .todo-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .todo-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #ff758c;
    }
    .todo-text {
      font-size: 0.92rem;
      font-weight: bold;
      color: #fff;
    }
    .custom-badge {
      font-size: 0.65rem;
      background: #00ffcc;
      color: #000;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: bold;
      margin-right: 4px;
    }

    .count-select {
      background: #1a1528;
      color: #00ffcc;
      border: 1px solid #554270;
      font-size: 0.78rem;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 6px;
    }

    .todo-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-del {
      background: transparent;
      color: #ff758c;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      font-weight: bold;
      padding: 0 4px;
    }
    .btn-del:hover {
      color: #ff5252;
    }

    /* 패널 공통 스타일 */
    .panel-box {
      display: none;
      background: #3d2b27;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .panel-box.active {
      display: block;
    }
    .admin-panel {
      border: 3px solid #ffb703;
      box-shadow: 0 4px 0 #b57600;
    }
    .user-panel {
      border: 3px solid #00ffcc;
      background: #1e3335;
      box-shadow: 0 4px 0 #008866;
    }
    .panel-box h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-group {
      display: flex;
      gap: 8px;
    }
    .form-group input, .form-group select {
      background: #1a1528;
      color: #fff;
      flex: 1;
      border-color: #554270;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🌸 블로썸 디마 숙제 체크리스트</h1>
      <p>공용 기본 숙제 + 나만의 개인 숙제 추가 시스템</p>
    </header>

    <div class="controls-panel">
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-restore" onclick="restoreDefault()">🔄 내 체크/횟수 초기화</button>
        <button class="btn btn-user-add" onclick="toggleUserPanel()">➕ 내 개인 숙제 추가</button>
      </div>
      <button class="btn btn-admin" id="adminToggleBtn" onclick="tryAdminLogin()">🔒 관리자 (공용 목록 수정)</button>
    </div>

    <!-- 🛠️ 제작자(관리자) 전용 공용 목록 추가 패널 -->
    <div class="panel-box admin-panel" id="adminPanel">
      <h3 style="color: #ffb703;">
        <span>🛠️ [관리자 모드] 공용 숙제 추가/삭제</span>
        <button class="btn" style="font-size: 0.75rem; padding: 3px 8px; background:#ff5252;" onclick="logoutAdmin()">닫기</button>
      </h3>
      <div class="form-group">
        <select id="adminNewType" style="max-width: 110px;">
          <option value="daily">☀️ 일일</option>
          <option value="weekly">📅 주간</option>
        </select>
        <input type="text" id="adminNewTitle" placeholder="모든 길드원에게 보일 공용 숙제 이름">
        <button class="btn" style="background:#ffb703; color:#000; font-weight:bold;" onclick="addMasterTodo()">공용 추가</button>
      </div>
    </div>

    <!-- 👤 유저 개인 숙제 추가 패널 (비밀번호 없음, 내 화면에만 추가됨) -->
    <div class="panel-box user-panel" id="userPanel">
      <h3 style="color: #00ffcc;">
        <span>👤 [개인 숙제 추가] 내 화면에만 나만의 숙제 만들기</span>
        <button class="btn" style="font-size: 0.75rem; padding: 3px 8px; background:#ff5252;" onclick="toggleUserPanel()">닫기</button>
      </h3>
      <div class="form-group">
        <select id="userNewType" style="max-width: 110px;">
          <option value="daily">☀️ 일일</option>
          <option value="weekly">📅 주간</option>
        </select>
        <input type="text" id="userNewTitle" placeholder="내가 따로 돌고 싶은 개인 숙제/던전 이름">
        <button class="btn" style="background:#00ffcc; color:#000; font-weight:bold;" onclick="addUserCustomTodo()">내 숙제 추가</button>
      </div>
    </div>

    <div class="reset-info">
      ⏱️ **일일 숙제**: 매일 00시 자동 리셋 | 💡 공용 숙제는 제작자가 관리하고, 개인 숙제는 [내 개인 숙제 추가]로 자유롭게 늘릴 수 있습니다!
    </div>

    <div class="homework-grid">
      <div class="homework-column">
        <div class="column-header">
          <span>☀️ 일일 숙제</span>
          <button class="btn" style="font-size: 0.75rem; padding: 4px 8px;" onclick="resetCheck('daily')">수동 체크 해제</button>
        </div>
        <div class="todo-list" id="dailyList"></div>
      </div>

      <div class="homework-column">
        <div class="column-header">
          <span>📅 주간 숙제</span>
          <button class="btn" style="font-size: 0.75rem; padding: 4px 8px;" onclick="resetCheck('weekly')">수동 체크 해제</button>
        </div>
        <div class="todo-list" id="weeklyList"></div>
      </div>
    </div>
  </div>

  <script>
    // 🌟 제작자가 세팅하는 기본 공용 던전 목록
    let MASTER_TODOS = JSON.parse(localStorage.getItem('blossom_master_todos_v4')) || [
      { id: 1, type: "daily", title: "☀️ 일일 퀘스트 & 출석체크" },
      { id: 2, type: "daily", title: "⚔️ 콜로세움 도전" },
      { id: 3, type: "daily", title: "🐉 일일 던전 (현카 / 사방 등)" },
      { id: 4, type: "weekly", title: "🏆 주간 레이드 보스 클리어" },
      { id: 5, type: "weekly", title: "📦 주간 던전 티켓 소진" }
    ];

    // 유저 개개인이 직접 추가한 개인 숙제 목록 (내 브라우저에만 저장됨)
    let USER_CUSTOM_TODOS = JSON.parse(localStorage.getItem('blossom_user_custom_todos_v1')) || [];

    let userStates = JSON.parse(localStorage.getItem('blossom_user_states_v7')) || {};
    let userCounts = JSON.parse(localStorage.getItem('blossom_user_counts_v2')) || {};
    let resetTimes = JSON.parse(localStorage.getItem('blossom_reset_times_v7')) || { lastDaily: 0, lastWeekly: 0 };
    
    let isAdmin = sessionStorage.getItem('blossom_is_admin') === 'true';
    const ADMIN_PASSWORD = "gktmddn0710"; // 설정하신 관리자 비밀번호

    function getLastDailyResetTime() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }

    function getLastWeeklyResetTime() {
      const d = new Date();
      const day = d.getDay();
      let diff = day - 2;
      if (diff === 0 && d.getHours() < 20) diff = 7;
      else if (diff < 0) diff += 7;
      d.setDate(d.getDate() - diff);
      d.setHours(20, 0, 0, 0);
      return d.getTime();
    }

    function checkAutoReset() {
      const now = Date.now();
      const targetDailyReset = getLastDailyResetTime();
      const targetWeeklyReset = getLastWeeklyResetTime();
      let isChanged = false;

      if (resetTimes.lastDaily < targetDailyReset) {
        MASTER_TODOS.filter(t => t.type === 'daily').forEach(t => { userStates[t.id] = false; });
        USER_CUSTOM_TODOS.filter(t => t.type === 'daily').forEach(t => { userStates[t.id] = false; });
        resetTimes.lastDaily = now;
        isChanged = true;
      }

      if (resetTimes.lastWeekly < targetWeeklyReset) {
        MASTER_TODOS.filter(t => t.type === 'weekly').forEach(t => { userStates[t.id] = false; });
        USER_CUSTOM_TODOS.filter(t => t.type === 'weekly').forEach(t => { userStates[t.id] = false; });
        resetTimes.lastWeekly = now;
        isChanged = true;
      }

      if (isChanged) save();
    }

    function save() {
      localStorage.setItem('blossom_master_todos_v4', JSON.stringify(MASTER_TODOS));
      localStorage.setItem('blossom_user_custom_todos_v1', JSON.stringify(USER_CUSTOM_TODOS));
      localStorage.setItem('blossom_user_states_v7', JSON.stringify(userStates));
      localStorage.setItem('blossom_user_counts_v2', JSON.stringify(userCounts));
      localStorage.setItem('blossom_reset_times_v7', JSON.stringify(resetTimes));
    }

    function render() {
      checkAutoReset();

      const dailyContainer = document.getElementById('dailyList');
      const weeklyContainer = document.getElementById('weeklyList');
      const adminPanel = document.getElementById('adminPanel');
      const adminToggleBtn = document.getElementById('adminToggleBtn');

      dailyContainer.innerHTML = '';
      weeklyContainer.innerHTML = '';

      if (isAdmin) {
        adminPanel.classList.add('active');
        adminToggleBtn.style.display = 'none';
      } else {
        adminPanel.classList.remove('active');
        adminToggleBtn.style.display = 'block';
      }

      // 1. 공용 기본 숙제 렌더링
      renderTodoList(MASTER_TODOS, dailyContainer, weeklyContainer, false);
      // 2. 유저 개인이 추가한 숙제 렌더링
      renderTodoList(USER_CUSTOM_TODOS, dailyContainer, weeklyContainer, true);
    }

    function renderTodoList(list, dailyContainer, weeklyContainer, isCustom) {
      list.forEach(item => {
        const isDone = !!userStates[item.id];
        const currentCount = userCounts[item.id] || "1판";

        const div = document.createElement('div');
        div.className = `todo-item ${isDone ? 'done' : ''} ${isCustom ? 'custom' : ''}`;
        
        div.innerHTML = `
          <div class="todo-left">
            <input type="checkbox" class="todo-checkbox" ${isDone ? 'checked' : ''} onchange="toggleTodo(${item.id})">
            <span class="todo-text">
              ${isCustom ? '<span class="custom-badge">내숙제</span>' : ''}
              ${item.title}
            </span>
          </div>
          <div class="todo-right">
            <select class="count-select" onchange="updateCount(${item.id}, this)">
              <option value="1판" ${currentCount === '1판' ? 'selected' : ''}>1판</option>
              <option value="2판" ${currentCount === '2판' ? 'selected' : ''}>2판</option>
              <option value="3판" ${currentCount === '3판' ? 'selected' : ''}>3판</option>
              <option value="4판" ${currentCount === '4판' ? 'selected' : ''}>4판</option>
              <option value="5판" ${currentCount === '5판' ? 'selected' : ''}>5판</option>
              <option value="10판" ${currentCount === '10판' ? 'selected' : ''}>10판</option>
              <option value="자유" ${currentCount === '자유' ? 'selected' : ''}>자유</option>
            </select>
            <!-- 공용 숙제는 관리자만 삭제 가능, 개인 숙제는 누구나 본인 화면에서 삭제 가능 -->
            ${isAdmin && !isCustom ? `<button class="btn-del" onclick="deleteMasterTodo(${item.id})" title="공용 삭제">✕</button>` : ''}
            ${isCustom ? `<button class="btn-del" onclick="deleteUserCustomTodo(${item.id})" title="내 숙제 삭제">✕</button>` : ''}
          </div>
        `;

        if (item.type === 'daily') {
          dailyContainer.appendChild(div);
        } else {
          weeklyContainer.appendChild(div);
        }
      });
    }

    function toggleTodo(id) {
      userStates[id] = !userStates[id];
      save();
      render();
    }

    function updateCount(id, selectEl) {
      userCounts[id] = selectEl.value;
      save();
    }

    function tryAdminLogin() {
      const inputPw = prompt("관리자 비밀번호를 입력하세요:");
      if (inputPw === ADMIN_PASSWORD) {
        isAdmin = true;
        sessionStorage.setItem('blossom_is_admin', 'true');
        alert("관리자 모드가 활성화되었습니다!");
        render();
      } else if (inputPw !== null) {
        alert("비밀번호가 틀렸습니다!");
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      sessionStorage.removeItem('blossom_is_admin');
      render();
    }

    // 유저 개인 숙제 추가 패널 토글
    function toggleUserPanel() {
      const panel = document.getElementById('userPanel');
      panel.classList.toggle('active');
    }

    // 관리자 공용 숙제 추가
    function addMasterTodo() {
      const type = document.getElementById('adminNewType').value;
      const title = document.getElementById('adminNewTitle').value.trim();

      if (!title) {
        alert("공용 숙제 이름을 입력해주세요!");
        return;
      }

      const newId = Date.now();
      MASTER_TODOS.push({ id: newId, type: type, title: title });
      userStates[newId] = false;
      userCounts[newId] = "1판";

      save();
      render();
      document.getElementById('adminNewTitle').value = '';
    }

    // 유저 개인 숙제 추가
    function addUserCustomTodo() {
      const type = document.getElementById('userNewType').value;
      const title = document.getElementById('userNewTitle').value.trim();

      if (!title) {
        alert("추가할 개인 숙제 이름을 입력해주세요!");
        return;
      }

      const newId = Date.now() + Math.random(); // 고유 ID 생성
      USER_CUSTOM_TODOS.push({ id: newId, type: type, title: title });
      userStates[newId] = false;
      userCounts[newId] = "1판";

      save();
      render();
      document.getElementById('userNewTitle').value = '';
      document.getElementById('userPanel').classList.remove('active');
    }

    // 공용 숙제 삭제 (관리자만)
    function deleteMasterTodo(id) {
      if (confirm("이 공용 숙제를 모든 유저 목록에서 삭제하시겠습니까?")) {
        MASTER_TODOS = MASTER_TODOS.filter(t => t.id !== id);
        delete userStates[id];
        delete userCounts[id];
        save();
        render();
      }
    }

    // 개인 숙제 삭제 (본인 화면에서만)
    function deleteUserCustomTodo(id) {
      if (confirm("이 개인 숙제를 목록에서 삭제하시겠습니까?")) {
        USER_CUSTOM_TODOS = USER_CUSTOM_TODOS.filter(t => t.id !== id);
        delete userStates[id];
        delete userCounts[id];
        save();
        render();
      }
    }

    function resetCheck(type) {
      const typeName = type === 'daily' ? '일일' : '주간';
      if (confirm(`${typeName} 숙제 체크를 모두 해제하시겠습니까? (설정하신 판수는 유지됩니다!)`)) {
        MASTER_TODOS.filter(t => t.type === type).forEach(t => { userStates[t.id] = false; });
        USER_CUSTOM_TODOS.filter(t => t.type === type).forEach(t => { userStates[t.id] = false; });
        save();
        render();
      }
    }

    function restoreDefault() {
      if (confirm("내 체크 상태와 판수 설정을 초기화하시겠습니까? (직접 추가한 개인 숙제는 유지됩니다)")) {
        userStates = {};
        userCounts = {};
        save();
        render();
      }
    }

    setInterval(checkAutoReset, 60000);
    render();
  </script>
</body>
</html>
