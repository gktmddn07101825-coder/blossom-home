<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 블로썸 디마 숙제 체크리스트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1528;
      color: #ffffff;
      font-family: 'Segoe UI', Malgun Gothic, sans-serif;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(#ff9a9e 0.6px, transparent 0.6px), radial-gradient(#ff9a9e 0.6px, #1a1528 0.6px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    .container {
      width: 100%;
      max-width: 850px;
    }
    
    header {
      text-align: center;
      margin-bottom: 20px;
      background: #2b1f3d;
      padding: 18px;
      border-radius: 16px;
      border: 4px solid #ff758c;
      box-shadow: 0 6px 0 #b33951, 0 10px 20px rgba(0,0,0,0.4);
    }
    header h1 {
      font-size: 1.8rem;
      color: #ff9a9e;
      margin-bottom: 4px;
      text-shadow: 2px 2px 0px #000;
    }
    header p {
      font-size: 0.85rem;
      color: #d1c4e9;
      font-weight: 500;
    }

    .controls-panel {
      background: #2b1f3d;
      padding: 12px 15px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border: 3px solid #ff758c;
      box-shadow: 0 4px 0 #b33951;
    }
    button, input, select {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #222;
      outline: none;
    }
    .btn {
      background: #ff758c;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #b33951;
      transition: 0.1s;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .btn-admin {
      background: #ffb703;
      color: #111;
      border-color: #d48b00;
      box-shadow: 0 3px 0 #b57600;
    }
    .btn-restore {
      background: #a18cd1;
      border-color: #7b52ae;
      box-shadow: 0 3px 0 #5c3d8a;
    }

    .reset-info {
      font-size: 0.8rem;
      color: #ffb7c5;
      text-align: center;
      margin-bottom: 20px;
      background: rgba(43, 31, 61, 0.8);
      padding: 8px;
      border-radius: 8px;
      border: 1px dashed #ff758c;
    }

    .homework-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 650px) {
      .homework-grid {
        grid-template-columns: 1fr;
      }
    }

    .homework-column {
      background: #2b1f3d;
      border-radius: 14px;
      padding: 16px;
      border: 3px solid #ff758c;
      box-shadow: 0 5px 0 #b33951;
      display: flex;
      flex-direction: column;
    }
    .column-header {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff9a9e;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px dashed #ff758c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 1px 1px 0 #000;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .todo-item {
      background: #382950;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #ff758c;
      box-shadow: 0 3px 0 #b33951;
      transition: 0.2s;
    }
    .todo-item.done {
      opacity: 0.45;
      background: #1c1427;
      border-color: #554270;
      box-shadow: none;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #9a8bb0;
    }
    .todo-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .todo-checkbox {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #ff758c;
    }
    .todo-text {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
    }
    .btn-del {
      background: transparent;
      color: #ff758c;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      font-weight: bold;
      padding: 0 4px;
    }
    .btn-del:hover {
      color: #ff5252;
    }

    .admin-panel {
      display: none;
      background: #3d2b27;
      padding: 15px;
      border-radius: 12px;
      border: 3px solid #ffb703;
      box-shadow: 0 4px 0 #b57600;
      margin-bottom: 20px;
    }
    .admin-panel.active {
      display: block;
    }
    .admin-panel h3 {
      font-size: 1rem;
      color: #ffb703;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-group {
      display: flex;
      gap: 8px;
    }
    .form-group input, .form-group select {
      background: #1a1528;
      color: #fff;
      flex: 1;
      border-color: #554270;
    }
    .btn-add {
      background: #ffb703;
      color: #000;
      border-color: #d48b00;
      box-shadow: 0 2px 0 #b57600;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🌸 블로썸 디마 숙제 체크리스트</h1>
      <p>길드원 공용 숙제판 & 자동 리셋 시스템</p>
    </header>

    <div class="controls-panel">
      <div>
        <button class="btn btn-restore" onclick="restoreDefault()">🔄 내 체크 상태 초기화</button>
      </div>
      <button class="btn btn-admin" id="adminToggleBtn" onclick="tryAdminLogin()">🔒 관리자 인증 (목록 수정)</button>
    </div>

    <!-- 제작자(관리자) 전용 편집 창 -->
    <div class="admin-panel" id="adminPanel">
      <h3>
        <span>🛠️ 공용 던전/숙제 목록 관리 모드 활성화됨</span>
        <button class="btn" style="font-size: 0.75rem; padding: 3px 8px; background:#ff5252;" onclick="logoutAdmin()">관리자 잠금</button>
      </h3>
      <div class="form-group">
        <select id="newType" style="max-width: 110px;">
          <option value="daily">☀️ 일일</option>
          <option value="weekly">📅 주간</option>
        </select>
        <input type="text" id="newTitle" placeholder="추가할 던전/숙제 이름">
        <button class="btn btn-add" onclick="addMasterTodo()">목록에 추가</button>
      </div>
    </div>

    <div class="reset-info">
      ⏱️ **일일 숙제**: 매일 00시 자동 리셋 | **주간 숙제**: 매주 화요일 20시 자동 리셋
    </div>

    <div class="homework-grid">
      <div class="homework-column">
        <div class="column-header">
          <span>☀️ 일일 숙제</span>
          <button class="btn" style="font-size: 0.75rem; padding: 4px 8px;" onclick="resetCheck('daily')">수동 리셋</button>
        </div>
        <div class="todo-list" id="dailyList"></div>
      </div>

      <div class="homework-column">
        <div class="column-header">
          <span>📅 주간 숙제</span>
          <button class="btn" style="font-size: 0.75rem; padding: 4px 8px;" onclick="resetCheck('weekly')">수동 리셋</button>
        </div>
        <div class="todo-list" id="weeklyList"></div>
      </div>
    </div>
  </div>

  <script>
    // 🌟 기본 공용 던전 목록
    let MASTER_TODOS = JSON.parse(localStorage.getItem('blossom_master_todos_v2')) || [
      { id: 1, type: "daily", title: "☀️ 일일 퀘스트 & 출석체크" },
      { id: 2, type: "daily", title: "⚔️ 콜로세움 도전" },
      { id: 3, type: "daily", title: "🐉 일일 던전 (현카 / 사방 등)" },
      { id: 4, type: "weekly", title: "🏆 주간 레이드 보스 클리어" },
      { id: 5, type: "weekly", title: "📦 주간 던전 티켓 소진" }
    ];

    let userStates = JSON.parse(localStorage.getItem('blossom_user_states_v5')) || {};
    let resetTimes = JSON.parse(localStorage.getItem('blossom_reset_times_v5')) || { lastDaily: 0, lastWeekly: 0 };
    
    // 관리자 로그인 상태 (브라우저 세션 동안 유지)
    let isAdmin = sessionStorage.getItem('blossom_is_admin') === 'true';

    // 🔑 본인만 아는 비밀번호 설정 (원하시는 문구로 바꾸셔도 됩니다!)
    const ADMIN_PASSWORD = "gktmddn0710"; // 예시 비밀번호 (필요시 변경 가능)

    function getLastDailyResetTime() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }

    function getLastWeeklyResetTime() {
      const d = new Date();
      const day = d.getDay();
      let diff = day - 2;
      if (diff === 0 && d.getHours() < 20) diff = 7;
      else if (diff < 0) diff += 7;
      d.setDate(d.getDate() - diff);
      d.setHours(20, 0, 0, 0);
      return d.getTime();
    }

    function checkAutoReset() {
      const now = Date.now();
      const targetDailyReset = getLastDailyResetTime();
      const targetWeeklyReset = getLastWeeklyResetTime();
      let isChanged = false;

      if (resetTimes.lastDaily < targetDailyReset) {
        MASTER_TODOS.filter(t => t.type === 'daily').forEach(t => { userStates[t.id] = false; });
        resetTimes.lastDaily = now;
        isChanged = true;
      }

      if (resetTimes.lastWeekly < targetWeeklyReset) {
        MASTER_TODOS.filter(t => t.type === 'weekly').forEach(t => { userStates[t.id] = false; });
        resetTimes.lastWeekly = now;
        isChanged = true;
      }

      if (isChanged) save();
    }

    function save() {
      localStorage.setItem('blossom_master_todos_v2', JSON.stringify(MASTER_TODOS));
      localStorage.setItem('blossom_user_states_v5', JSON.stringify(userStates));
      localStorage.setItem('blossom_reset_times_v5', JSON.stringify(resetTimes));
    }

    function render() {
      checkAutoReset();

      const dailyContainer = document.getElementById('dailyList');
      const weeklyContainer = document.getElementById('weeklyList');
      const adminPanel = document.getElementById('adminPanel');
      const adminToggleBtn = document.getElementById('adminToggleBtn');

      dailyContainer.innerHTML = '';
      weeklyContainer.innerHTML = '';

      // 관리자 권한 상태에 따른 UI 변경
      if (isAdmin) {
        adminPanel.classList.add('active');
        adminToggleBtn.style.display = 'none';
      } else {
        adminPanel.classList.remove('active');
        adminToggleBtn.style.display = 'block';
      }

      MASTER_TODOS.forEach(item => {
        const isDone = !!userStates[item.id];
        const div = document.createElement('div');
        div.className = `todo-item ${isDone ? 'done' : ''}`;
        
        div.innerHTML = `
          <div class="todo-left">
            <input type="checkbox" class="todo-checkbox" ${isDone ? 'checked' : ''} onchange="toggleTodo(${item.id})">
            <span class="todo-text">${item.title}</span>
          </div>
          ${isAdmin ? `<button class="btn-del" onclick="deleteMasterTodo(${item.id})" title="삭제">✕</button>` : ''}
        `;

        if (item.type === 'daily') {
          dailyContainer.appendChild(div);
        } else {
          weeklyContainer.appendChild(div);
        }
      });
    }

    function toggleTodo(id) {
      userStates[id] = !userStates[id];
      save();
      render();
    }

    // 관리자 로그인 시도
    function tryAdminLogin() {
      const inputPw = prompt("제작자(관리자) 비밀번호를 입력하세요:");
      if (inputPw === ADMIN_PASSWORD) {
        isAdmin = true;
        sessionStorage.setItem('blossom_is_admin', 'true');
        alert("관리자 모드가 활성화되었습니다!");
        render();
      } else if (inputPw !== null) {
        alert("비밀번호가 틀렸습니다!");
      }
    }

    // 관리자 로그아웃 (잠금)
    function logoutAdmin() {
      isAdmin = false;
      sessionStorage.removeItem('blossom_is_admin');
      render();
    }

    function addMasterTodo() {
      const type = document.getElementById('newType').value;
      const title = document.getElementById('newTitle').value.trim();

      if (!title) {
        alert("던전/숙제 이름을 입력해주세요!");
        return;
      }

      const newId = Date.now();
      MASTER_TODOS.push({ id: newId, type: type, title: title });
      userStates[newId] = false;

      save();
      render();
      document.getElementById('newTitle').value = '';
    }

    function deleteMasterTodo(id) {
      if (confirm("이 던전/숙제를 공용 목록에서 완전히 삭제하시겠습니까?")) {
        MASTER_TODOS = MASTER_TODOS.filter(t => t.id !== id);
        delete userStates[id];
        save();
        render();
      }
    }

    function resetCheck(type) {
      const typeName = type === 'daily' ? '일일' : '주간';
      if (confirm(`${typeName} 숙제 체크를 모두 해제하시겠습니까?`)) {
        MASTER_TODOS.filter(t => t.type === type).forEach(t => {
          userStates[t.id] = false;
        });
        save();
        render();
      }
    }

    function restoreDefault() {
      if (confirm("내 체크 상태를 모두 초기화하시겠습니까?")) {
        userStates = {};
        save();
        render();
      }
    }

    setInterval(checkAutoReset, 60000);
    render();
  </script>
</body>
</html>
