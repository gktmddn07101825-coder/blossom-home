<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 블로썸 길드 이벤트 캘린더</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121118;
      color: #ffffff;
      font-family: 'Segoe UI', Malgun Gothic, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
    }

    /* 🎮 상단 네비게이션 */
    nav.navbar {
      width: 100%;
      background: #1e122b;
      border-bottom: 3px solid #ff758c;
      display: flex;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      height: 60px;
    }
    .brand-logo {
      font-size: 1.3rem;
      font-weight: 900;
      color: #ff9a9e;
      text-decoration: none;
      text-shadow: 0 0 10px #ff758c;
    }

    .main-container {
      width: 100%;
      max-width: 1200px;
      padding: 20px;
    }

    /* 상단 헤더 & 관리자 조작 버튼 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: #1e1929;
      padding: 15px 20px;
      border-radius: 12px;
      border: 2px solid #ff758c;
    }
    .header-bar h1 {
      font-size: 1.5rem;
      color: #ff9a9e;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-admin {
      background: #ffb703;
      color: #111;
      box-shadow: 0 3px 0 #b57600;
    }
    .btn-admin:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 🛠️ 관리자 전용 작성 패널 */
    .admin-panel {
      display: none;
      background: #251c2e;
      border: 2px solid #ffb703;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .admin-panel.active {
      display: block;
    }
    .admin-panel h3 {
      color: #ffb703;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .form-grid input, .form-grid select {
      background: #121118;
      color: #fff;
      border: 1px solid #554270;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
    }
    .btn-add {
      background: #ff758c;
      color: white;
      box-shadow: 0 3px 0 #b33951;
      width: 100%;
      padding: 10px;
      font-size: 0.95rem;
    }

    /* 📅 게임 타임라인 달력 보드 */
    .timeline-wrapper {
      background: #171522;
      border-radius: 14px;
      border: 2px solid #382950;
      overflow-x: auto;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .timeline-container {
      min-width: 1000px;
      position: relative;
    }

    /* 날짜 헤더 (월/일 표시) */
    .timeline-header {
      display: flex;
      background: #0f0e17;
      border-bottom: 2px solid #2b1f3d;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .day-cell {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
      color: #8a7b9d;
    }
    .day-cell.today {
      background: rgba(255, 117, 140, 0.15);
      color: #ff758c;
      font-weight: bold;
    }
    .day-number {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      margin-top: 2px;
    }
    .day-cell.today .day-number {
      color: #ff9a9e;
    }

    /* 현재 시간 표시 세로선 (붉은 레이저 라인) */
    .current-time-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ff3366;
      box-shadow: 0 0 8px #ff3366;
      z-index: 5;
      pointer-events: none;
    }
    .current-time-badge {
      position: absolute;
      top: 4px;
      transform: translateX(-50%);
      background: #ff3366;
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    /* 이벤트 바 트랙 레인 */
    .timeline-body {
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      min-height: 300px;
      /* 날짜별 격자 배경선 */
      background-size: calc(100% / 15) 100%;
      background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px);
    }

    /* 🏷️ 이벤트 바 스타일 */
    .event-bar-track {
      position: relative;
      height: 44px;
      width: 100%;
    }
    .event-bar {
      position: absolute;
      height: 100%;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      color: white;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255,255,255,0.2);
      transition: transform 0.15s;
      overflow: hidden;
    }
    .event-bar::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35); /* 글씨 가독성을 위한 어두운 오버레이 */
      z-index: 1;
    }
    .event-bar:hover {
      transform: scale(1.01);
      z-index: 8;
    }
    .event-title {
      position: relative;
      z-index: 2;
      text-shadow: 1px 1px 3px #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 10px;
    }
    .event-dday {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      border: 1px solid rgba(255,255,255,0.3);
      white-space: nowrap;
    }
    .btn-del-event {
      position: relative;
      z-index: 3;
      background: #ff5252;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
      cursor: pointer;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">🌸 BLOSSOM GUILD</a>
      <a href="index.html" style="color:#d1c4e9; text-decoration:none; font-size:0.9rem; font-weight:bold;">🏠 메인 홈으로</a>
    </div>
  </nav>

  <div class="main-container">
    <div class="header-bar">
      <h1>🗓️ 길드 이벤트 캘린더</h1>
      <button class="btn-admin" id="adminBtn" onclick="tryAdminLogin()">🔒 이벤트 관리 (관리자)</button>
    </div>

    <!-- 관리자 작성 폼 -->
    <div class="admin-panel" id="adminPanel">
      <h3>➕ 새 이벤트 등록</h3>
      <div class="form-grid">
        <input type="text" id="evTitle" placeholder="이벤트 제목 (예: 핫타임 사냥 BOOST UP!)">
        <input type="date" id="evStart">
        <input type="date" id="evEnd">
        <input type="text" id="evBg" placeholder="배경 이미지 URL (선택 사항)">
        <select id="evColor">
          <option value="#ff758c">🌸 핑크 테마</option>
          <option value="#2196f3">🔷 블루 테마</option>
          <option value="#4caf50">🟢 그린 테마</option>
          <option value="#ff9800">🟠 오렌지 테마</option>
          <option value="#9c27b0">🟣 퍼플 테마</option>
        </select>
      </div>
      <button class="btn-add" onclick="addEvent()">이벤트 달력에 등록</button>
    </div>

    <!-- 타임라인 달력판 -->
    <div class="timeline-wrapper">
      <div class="timeline-container" id="timelineContainer">
        <!-- 상단 날짜 헤더 -->
        <div class="timeline-header" id="timelineHeader"></div>

        <!-- 실시간 세로 기준선 -->
        <div class="current-time-line" id="timeLine">
          <div class="current-time-badge" id="timeBadge">NOW</div>
        </div>

        <!-- 이벤트 바 레인 -->
        <div class="timeline-body" id="timelineBody"></div>
      </div>
    </div>
  </div>

  <script>
    // 🌟 15일간의 범위 타임라인 구성 (오늘 기준 -3일 ~ +11일)
    const DAYS_TOTAL = 15;
    const START_OFFSET = -3; 
    
    // 샘플 디폴트 이벤트 데이터
    let EVENTS = JSON.parse(localStorage.getItem('blossom_events_v1')) || [
      {
        id: 1,
        title: "[핫타임] 경험치 & 사냥 BOOST UP!",
        start: getOffsetDate(-2),
        end: getOffsetDate(3),
        bg: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500",
        color: "#ff758c"
      },
      {
        id: 2,
        title: "🏆 주간 길드 콜로세움 도전 주간",
        start: getOffsetDate(0),
        end: getOffsetDate(6),
        bg: "",
        color: "#2196f3"
      }
    ];

    let isAdmin = sessionStorage.getItem('blossom_event_admin') === 'true';
    const ADMIN_PASSWORD = "gktmddn0710";

    function getOffsetDate(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function initTimeline() {
      renderHeader();
      renderEvents();
      updateTimeLinePosition();
    }

    // 날짜 헤더 생성 (월/일 표시 및 오늘 표시)
    function renderHeader() {
      const headerEl = document.getElementById('timelineHeader');
      headerEl.innerHTML = '';

      const todayStr = new Date().toISOString().split('T')[0];

      for (let i = 0; i < DAYS_TOTAL; i++) {
        const d = new Date();
        d.setDate(d.getDate() + START_OFFSET + i);

        const dateStr = d.toISOString().split('T')[0];
        const month = d.getMonth() + 1;
        const dateNum = d.getDate();
        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        const dayName = dayNames[d.getDay()];

        const cell = document.createElement('div');
        cell.className = `day-cell ${dateStr === todayStr ? 'today' : ''}`;
        cell.innerHTML = `
          <div>${month}월 (${dayName})</div>
          <div class="day-number">${dateNum}</div>
        `;
        headerEl.appendChild(cell);
      }
    }

    // 이벤트 바 위치 및 길이 계산하여 화면에 배치
    function renderEvents() {
      const bodyEl = document.getElementById('timelineBody');
      const adminPanel = document.getElementById('adminPanel');
      const adminBtn = document.getElementById('adminBtn');

      bodyEl.innerHTML = '';

      if (isAdmin) {
        adminPanel.classList.add('active');
        adminBtn.textContent = '🔓 작성 모드 중';
      } else {
        adminPanel.classList.remove('active');
        adminBtn.textContent = '🔒 이벤트 관리 (관리자)';
      }

      const startDateWindow = new Date();
      startDateWindow.setDate(startDateWindow.getDate() + START_OFFSET);
      startDateWindow.setHours(0, 0, 0, 0);

      EVENTS.forEach(ev => {
        const evStart = new Date(ev.start + 'T00:00:00');
        const evEnd = new Date(ev.end + 'T23:59:59');

        // 타임라인 내 시작 % 및 너비 % 계산
        const startDiffDays = (evStart - startDateWindow) / (1000 * 60 * 60 * 24);
        const durationDays = (evEnd - evStart) / (1000 * 60 * 60 * 24);

        let leftPercent = (startDiffDays / DAYS_TOTAL) * 100;
        let widthPercent = (durationDays / DAYS_TOTAL) * 100;

        // 화면 밖으로 벗어나는 경우 보정
        if (leftPercent < 0) {
          widthPercent += leftPercent;
          leftPercent = 0;
        }

        const track = document.createElement('div');
        track.className = 'event-bar-track';

        const bar = document.createElement('div');
        bar.className = 'event-bar';
        bar.style.left = `${leftPercent}%`;
        bar.style.width = `${widthPercent}%`;
        bar.style.backgroundColor = ev.color || '#ff758c';

        if (ev.bg) {
          bar.style.backgroundImage = `url('${ev.bg}')`;
        }

        // 남은 D-day 계산
        const now = new Date();
        const remainMs = evEnd - now;
        let ddayText = "";
        if (remainMs > 0) {
          const daysLeft = Math.floor(remainMs / (1000 * 60 * 60 * 24));
          ddayText = daysLeft === 0 ? "오늘 종료" : `${daysLeft}일 남음`;
        } else {
          ddayText = "종료됨";
        }

        bar.innerHTML = `
          <span class="event-title">${ev.title}</span>
          <div style="display:flex; align-items:center;">
            <span class="event-dday">${ddayText}</span>
            ${isAdmin ? `<button class="btn-del-event" onclick="deleteEvent(${ev.id})">✕</button>` : ''}
          </div>
        `;

        track.appendChild(bar);
        bodyEl.appendChild(track);
      });
    }

    // 현재 시각 붉은 세로선 위치 업데이트
    function updateTimeLinePosition() {
      const now = new Date();
      const startDateWindow = new Date();
      startDateWindow.setDate(startDateWindow.getDate() + START_OFFSET);
      startDateWindow.setHours(0, 0, 0, 0);

      const diffMs = now - startDateWindow;
      const totalMs = DAYS_TOTAL * 24 * 60 * 60 * 1000;
      const percent = (diffMs / totalMs) * 100;

      const lineEl = document.getElementById('timeLine');
      const badgeEl = document.getElementById('timeBadge');

      if (percent >= 0 && percent <= 100) {
        lineEl.style.left = `${percent}%`;
        lineEl.style.display = 'block';
        badgeEl.textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      } else {
        lineEl.style.display = 'none';
      }
    }

    function saveEvents() {
      localStorage.setItem('blossom_events_v1', JSON.stringify(EVENTS));
    }

    function tryAdminLogin() {
      if (isAdmin) {
        if (confirm("작성 모드를 종료하시겠습니까?")) {
          isAdmin = false;
          sessionStorage.removeItem('blossom_event_admin');
          renderEvents();
        }
        return;
      }

      const input = prompt("관리자 비밀번호를 입력해 주세요:");
      if (input === ADMIN_PASSWORD) {
        isAdmin = true;
        sessionStorage.setItem('blossom_event_admin', 'true');
        alert("관리자 인증 완료!");
        renderEvents();
      } else if (input !== null) {
        alert("비밀번호가 틀렸습니다!");
      }
    }

    function addEvent() {
      const title = document.getElementById('evTitle').value.trim();
      const start = document.getElementById('evStart').value;
      const end = document.getElementById('evEnd').value;
      const bg = document.getElementById('evBg').value.trim();
      const color = document.getElementById('evColor').value;

      if (!title || !start || !end) {
        alert("이벤트 제목과 시작일, 종료일을 모두 설정해 주세요!");
        return;
      }

      if (new Date(start) > new Date(end)) {
        alert("종료일은 시작일보다 이후여야 합니다!");
        return;
      }

      EVENTS.push({
        id: Date.now(),
        title: title,
        start: start,
        end: end,
        bg: bg,
        color: color
      });

      saveEvents();
      renderEvents();

      document.getElementById('evTitle').value = '';
      document.getElementById('evStart').value = '';
      document.getElementById('evEnd').value = '';
      document.getElementById('evBg').value = '';
    }

    function deleteEvent(id) {
      if (confirm("이 이벤트를 달력에서 삭제하시겠습니까?")) {
        EVENTS = EVENTS.filter(e => e.id !== id);
        saveEvents();
        renderEvents();
      }
    }

    initTimeline();
    setInterval(updateTimeLinePosition, 60000); // 1분마다 위치 갱신
  </script>
</body>
</html>
